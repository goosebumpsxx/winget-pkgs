ShortDescription: Find job applications in your inbox and save the CVs into one folder per applicant.
Description: |-
  Applicant Packager is a free Windows app for recruiters and small agencies. It scans a Thunderbird mailbox or an IMAP inbox (Gmail, Outlook and Microsoft 365, Yahoo) for job application emails, shows why each one matched your keywords, reads inside PDF, Word and scanned CVs, and saves the CVs you select into folders by search, role and applicant.
  It is read-only: it never moves, deletes or marks mail, and the files stay on your computer. It also includes the read-only applicants command-line tool.
